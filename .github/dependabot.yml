version: 2
updates:
  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "automated"
    ignore:
      # @types/vscode must not be newer than engines.vscode in package.json, or `vsce package`
      # refuses to build the VSIX. Bump both together, by hand, when raising the minimum VS Code.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # typescript-eslint 8.x only supports TypeScript < 6.1 (peer dependency), so TypeScript 7
      # breaks `npm install` with ERESOLVE. Lift this once typescript-eslint supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Group React-related dependencies
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
        update-types:
          - "minor"
          - "patch"
      # Group Vite-related dependencies
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
        update-types:
          - "minor"
          - "patch"
      # Group TypeScript-related dependencies
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
      # Group VS Code extension dependencies
      vscode:
        patterns:
          - "@types/vscode"
          - "@vscode/*"
        update-types:
          - "minor"
          - "patch"
      # Group linting and formatting tools
      tooling:
        patterns:
          - "@ESLint/*"
          - "eslint"
        update-types:
          - "minor"
          - "patch"