name: Release standalone app

# Builds the standalone (Electron) installers and attaches them to a GitHub Release.
# The app checks these releases (src/standalone/updateCheck.ts) and tells users when a
# newer installer for their platform is available.
#
# Runs when a release is published (creating it from the GitHub UI or with `gh release create`
# triggers it; releases created by other workflows with GITHUB_TOKEN do not), or manually for
# an existing release tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the installers to (e.g. 0.7.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-standalone-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runs-on: macos-latest
            builder-args: --mac
            installers: dist/standalone/*.dmg
          - name: Windows
            runs-on: windows-latest
            builder-args: --win
            installers: dist/standalone/*.exe
    runs-on: ${{ matrix.runs-on }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check that package.json matches the tag
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Build
        run: npm run standalone:build

      - name: Package installers
        # Installers are not code-signed yet; skip looking for a signing identity on the runner.
        run: npx electron-builder --config electron-builder.yml ${{ matrix.builder-args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Attach installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l ${{ matrix.installers }}
          gh release upload "$TAG" ${{ matrix.installers }} --clobber
