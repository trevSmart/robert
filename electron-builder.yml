# Packaging of the standalone (Electron) version of IBM Robert.
# Build with: npm run standalone:package  (outputs to dist/standalone/)
appId: com.ibm.robert
# Name of the .app bundle, shown in the Dock and the app menu. The profile directory and
# Keychain item keep the internal name "IBM Robert" (see APP_INTERNAL_NAME in src/standalone/main.ts).
productName: Robert
copyright: For IBM internal use only.

directories:
  output: dist/standalone
  buildResources: resources

# package.json "main" points at the VS Code extension entry; the app uses its own.
extraMetadata:
  main: out/src/standalone/main.js

files:
  - package.json
  - out/src/**/*.js
  - "!out/src/**/*.test.js"
  - out/webview/**
  - "!out/webview/**/*.map"
  - src/webview/loading.html
  - media/**
  - resources/icons/**
  - resources/fonts/**
  - resources/video.mp4
  - "!**/.DS_Store"

asar: true

# Installer names carry OS and CPU (e.g. Robert-0.7.0-mac-arm64.dmg, Robert-0.7.0-win-x64.exe):
# the in-app update check (src/standalone/updateCheck.ts) picks the GitHub Release asset by them.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
# Releases are published by .github/workflows/release-standalone.yml with `gh release upload`.
publish: null

mac:
  category: public.app-category.productivity
  # Follows Apple's icon template (824px rounded rect with transparent margin on a
  # 1024px canvas). A full-bleed icon gets boxed in a light plate by recent macOS.
  icon: resources/icons/robert-logo-macos.png
  # Intel and Apple silicon installers; the update check offers the one for the user's CPU.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - zip

win:
  icon: resources/icons/robert-logo4.png
  target:
    - target: nsis
      arch: x64

nsis:
  # NSIS has its own default name ("Robert Setup x.y.z.exe"); keep the shared pattern.
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  oneClick: false
  perMachine: false

linux:
  icon: resources/icons/robert-logo4.png
  category: Office
  target:
    - AppImage
